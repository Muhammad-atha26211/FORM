<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <link rel="stylesheet" href="styleRegistrasi.css">
  </head>
  <body>
    <div class="login-container">
     <h1>Form Registrasi</h1>
      <form action="#" method="POST">
        <input type="text" id="E-mail : " name="E-mail" placeholder="Masukkan E-mail" required>
        <input type="password" id="password : " name="password" placeholder="Masukkan password" required>
        <input type="password" id="confirm-password : " name="confirm-password" placeholder="Masukkan ulang password" required>
        <button type="submit">Daftar</button>
        <p>Sudaf punya akun? <a href="FormLogin.html">Login</a></p>
      </form>
    </div>
  </body>
</html>
